name: Test automation
on:
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/**']
  pull_request:
    paths: ['automation/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
      - run: npm run check
