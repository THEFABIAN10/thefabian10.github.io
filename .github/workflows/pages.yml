name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir _site
          cp index.html app.js data-config.js push-notifications.js push-config.json OneSignalSDKWorker.js manifest.json favicon.ico favicon.svg icon-192.png icon-512.png _site/
          cp -R data _site/data
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - uses: actions/deploy-pages@v4
        id: deployment
