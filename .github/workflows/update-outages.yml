name: Update outage data
on:
  workflow_dispatch:
    inputs:
      notify:
        description: Send push after publication (disable only for migration verification)
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: outage-data-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: site
      - uses: actions/checkout@v7
        with:
          ref: outage-state
          path: state
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch and save data (keep previous data on source failures)
        run: node site/automation/scripts/update-github.mjs fetch state site
      - name: Publish JSON and dispatch Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/automation/scripts/update-github.mjs publish state site
      - name: Confirm public data without sending push
        if: ${{ !inputs.notify }}
        run: node site/automation/scripts/update-github.mjs verify state site
      - name: Confirm publication and send notifications
        if: ${{ inputs.notify }}
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node site/automation/scripts/update-github.mjs notify state site
