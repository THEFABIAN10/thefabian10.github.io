name: Check outage update health
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: outage-update-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check cron, repeated failures and public data freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node automation/scripts/check-update-health.mjs
